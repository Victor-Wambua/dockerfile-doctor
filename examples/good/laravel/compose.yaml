# Runs the two images from the Dockerfile together. Local use only: ports are bound to loopback.
services:
  app:
    build:
      context: .
      target: app
    image: sample-php-app:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  web:
    build:
      context: .
      target: web
    image: sample-php-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
