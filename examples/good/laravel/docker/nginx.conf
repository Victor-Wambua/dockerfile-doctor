server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;

    location = /ping {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
